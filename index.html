<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para la niña más hermosa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            background-color: #0b0b1a;
            color: #fff;
        }

        /* Pantalla 1: Pregunta e imagen de fondo */
        #screen1 {
            width: 100vw;
            height: 100vh;
            /* Cambia 'fondo.jpg' por el nombre o ruta de tu segunda imagen */
            background: url('fondo.jpg') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .card-container {
            background: rgba(20, 15, 38, 0.75);
            backdrop-filter: blur(8px);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 90%;
            width: 380px;
        }

        .card-container h1 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #9333ea, #db2777);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Mensaje emergente "grosera 😡" */
        #angryMessage {
            display: none;
            font-size: 1.3rem;
            color: #ff4d4d;
            font-weight: bold;
            margin-top: 15px;
            animation: fadeInOut 2.5s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.8); }
            20% { opacity: 1; transform: scale(1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.8); }
        }

        /* Pantalla 2: Carta con imagen */
        #screen2 {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            width: 100vw;
            padding: 20px 10px;
            background-color: #0b0b1a;
            position: relative;
        }

        .letter-wrapper {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .letter-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .btn-love {
            margin-top: 25px;
            margin-bottom: 40px;
            padding: 16px 40px;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #ff0055, #ff5050);
            box-shadow: 0 4px 20px rgba(255, 0, 85, 0.6);
            border-radius: 50px;
            width: auto;
        }

        /* Corazones flotantes */
        .heart {
            position: fixed;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            z-index: 9999;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) scale(0.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Pantalla 1: Pregunta inicial -->
    <div id="screen1">
        <div class="card-container">
            <h1>¿Quién es la niña más hermosa?</h1>
            <div class="btn-group">
                <button class="btn" onclick="openLetter()">Yo</button>
                <button class="btn btn-secondary" id="btnNo" onclick="handleNo()">No sé, pregúntale</button>
            </div>
            <div id="angryMessage">grosera 😡</div>
        </div>
    </div>

    <!-- Pantalla 2: Contenido de la carta -->
    <div id="screen2">
        <div class="letter-wrapper">
            <!-- Cambia 'carta.jpg' por el nombre o ruta de tu primera imagen -->
            <img src="carta.jpg" alt="Carta especial" class="letter-img">
            <button class="btn btn-love" onclick="createHeartRain()">TE AMO</button>
        </div>
    </div>

    <script>
        function handleNo() {
            const btnNo = document.getElementById('btnNo');
            const msg = document.getElementById('angryMessage');
            
            // Oculta el botón
            btnNo.style.display = 'none';
            
            // Muestra el mensaje con animación
            msg.style.display = 'block';
            
            // Reinicia el mensaje si se vuelve a activar la animación
            msg.style.animation = 'none';
            msg.offsetHeight; // Trigger reflow
            msg.style.animation = 'fadeInOut 2.5s forwards';

            setTimeout(() => {
                msg.style.display = 'none';
            }, 2500);
        }

        function openLetter() {
            document.getElementById('screen1').style.display = 'none';
            document.getElementById('screen2').style.display = 'flex';
            window.scrollTo(0, 0);
        }

        function createHeartRain() {
            const heartIcons = ['❤️', '💖', '💗', '💓', '✨', '🌸'];
            
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                    
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    heart.style.fontSize = (Math.random() * 15 + 20) + 'px';
                    
                    document.body.appendChild(heart);
                    
                    setTimeout(() => {
                        heart.remove();
                    }, 4000);
                }, i * 80);
            }
        }
    </script>
</body>
</html>
