<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para la niña más hermosa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            background-color: #0b0b1a;
            color: #fff;
        }

        #screen1 {
            width: 100vw;
            min-height: 100vh;
            background: url('92c584b8cada5cf6a61f2e0c5608cfe2.jpg') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        .card-container {
            background: rgba(20, 15, 38, 0.8);
            backdrop-filter: blur(10px);
            padding: 40px 20px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 400px;
        }

        .card-container h1 {
            font-size: 1.6rem;
            margin-bottom: 30px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.7);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            border: none;
            padding: 16px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        #angryMessage {
            display: none;
            font-size: 1.5rem;
            color: #ff4d4d;
            font-weight: bold;
            margin-top: 20px;
            animation: fadeInOut 2.5s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.8); }
            20% { opacity: 1; transform: scale(1.1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.8); }
        }

        #screen2 {
            display: none;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            padding: 20px;
            background-color: #0b0b1a;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
        }

        .letter-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .letter-img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: block;
        }

        .btn-love {
            margin-top: 30px;
            margin-bottom: 50px;
            padding: 20px 50px;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #ff0055, #ff5050);
            box-shadow: 0 6px 25px rgba(255, 0, 85, 0.4);
        }

        .heart {
            position: fixed;
            font-size: 30px;
            user-select: none;
            pointer-events: none;
            z-index: 1000;
            top: -50px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div id="screen1">
        <div class="card-container">
            <h1>¿Quién es la niña más hermosa?</h1>
            <div class="btn-group">
                <button class="btn" onclick="openLetter()">Yo</button>
                <button class="btn btn-secondary" id="btnNo" onclick="handleNo()">No sé, pregúntale</button>
            </div>
            <div id="angryMessage">grosera 😡</div>
        </div>
    </div>

    <div id="screen2">
        <div class="letter-wrapper">
            <img src="IMG1794273564955.jpg" alt="Carta especial" class="letter-img">
            <button class="btn btn-love" onclick="createHeartRain()">TE AMO</button>
        </div>
    </div>

    <script>
        function handleNo() {
            const btnNo = document.getElementById('btnNo');
            const msg = document.getElementById('angryMessage');
            btnNo.style.display = 'none';
            msg.style.display = 'block';
            msg.style.animation = 'none';
            msg.offsetHeight;
            msg.style.animation = 'fadeInOut 2.5s forwards';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 2500);
        }

        function openLetter() {
            document.getElementById('screen1').style.display = 'none';
            document.getElementById('screen2').style.display = 'flex';
            window.scrollTo(0, 0);
        }

        function createHeartRain() {
            const heartIcons = ['❤️', '💖', '💗', '💓', '✨', '🌸'];
            for (let i = 0; i < 35; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                    heart.style.left = Math.random() * 90 + 'vw';
                    heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                    heart.style.fontSize = (Math.random() * 20 + 25) + 'px';
                    document.body.appendChild(heart);
                    setTimeout(() => {
                        heart.remove();
                    }, 6000);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
